name: Android release (.aab)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CALLOUT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret CALLOUT_UPLOAD_KEYSTORE_BASE64 is missing (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed .aab
        env:
          NODE_ENV: production
          CALLOUT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          CALLOUT_UPLOAD_STORE_PASSWORD: ${{ secrets.CALLOUT_UPLOAD_STORE_PASSWORD }}
          CALLOUT_UPLOAD_KEY_ALIAS: ${{ secrets.CALLOUT_UPLOAD_KEY_ALIAS }}
          CALLOUT_UPLOAD_KEY_PASSWORD: ${{ secrets.CALLOUT_UPLOAD_KEY_PASSWORD }}
        run: npm run build:aab

      - uses: actions/upload-artifact@v4
        with:
          name: callout-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
